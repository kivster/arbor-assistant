[project]
name = "arbor-assistant"
version = "0.1.0.dev0"
description = "Arbor parent portal integration for Home Assistant"
requires-python = ">=3.14.2"
dependencies = ["aiohttp>=3.11,<4"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "homeassistant==2026.10.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
